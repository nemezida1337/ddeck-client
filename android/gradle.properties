# AndroidX is required by the app module's dependencies and by Android's own
# WebView/Keystore helpers.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Gradle daemon runs from the workspace toolchain; keep its heap modest so it
# stays comfortable next to the editor and the harness.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Kotlin compiler daemon writes its markers to
# ~/Library/Application Support/kotlin/daemon, which the sandbox forbids. In-process
# compilation keeps everything inside the Gradle daemon instead.
kotlin.compiler.execution.strategy=in-process
