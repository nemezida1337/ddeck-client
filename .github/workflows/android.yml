name: Android build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Plugin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Import plugin without npm install
        run: node --input-type=module -e "import('./plugin/lib/index.js').then(() => console.log('plugin import ok'))"
      - name: POSIX installer smoke
        run: |
          profile="$RUNNER_TEMP/dsh-profile"
          mkdir -p "$profile"
          echo '{}' > "$profile/package.json"
          ./plugin/install.sh "$profile"
          test -L "$profile/node_modules/dsh-remote"
          grep -q 'dsh-remote' "$profile/cordis.patch.yml"
          ./plugin/uninstall.sh "$profile"
          test ! -e "$profile/node_modules/dsh-remote"
          echo 'POSIX install/uninstall: ok'


  windows-installer:
    name: Windows installer syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('plugin/install.ps1', 'plugin/uninstall.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'PowerShell installers parse: ok'
      - name: Install into a temporary DSH profile
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'dsh-profile'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          Set-Content -Path (Join-Path $profile 'package.json') -Value '{}' -Encoding utf8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\plugin\install.ps1 -Profile $profile
          if (-not (Test-Path (Join-Path $profile 'node_modules\dsh-remote'))) { throw 'junction not created' }
          $json = Get-Content (Join-Path $profile 'package.json') -Raw | ConvertFrom-Json
          if ($json.dependencies.'dsh-remote' -notlike 'link:*') { throw 'dependency missing' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\plugin\uninstall.ps1 -Profile $profile
          if (Test-Path (Join-Path $profile 'node_modules\dsh-remote')) { throw 'junction not removed' }
          Write-Host 'Windows install/uninstall: ok'


  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
